name = "wopha-backup"
main = "index.js"
compatibility_date = "2026-07-01"

# Mondays 06:00 UTC (≈ 1–2 a.m. Eastern)
[triggers]
crons = ["0 6 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "wopha"
database_id = "0856504b-dae6-4887-98ac-01d46bfce135"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "wopha-backups"
